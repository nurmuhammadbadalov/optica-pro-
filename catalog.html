<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achki Do'koni | Katalog</title>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #151c2c;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --border-color: #334155;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #d97706;
      --accent-hover: #b45309;
      --border-color: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; transition: background-color 0.3s, color 0.3s; }
    body { background-color: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow); }
    .nav-container { max-width: 1300px; margin: 0 auto; padding: 1.2rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 1.6rem; font-weight: 800; color: var(--accent); text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 3rem; list-style: none; }
    .nav-links a { color: var(--text-primary); text-decoration: none; font-weight: 600; padding: 0.6rem 1.2rem; border-radius: 8px; }
    .nav-links a:hover, .nav-links a.active { background-color: var(--accent); color: #ffffff; }
    .cart-badge { background-color: #ef4444; color: white; border-radius: 9999px; padding: 0.2rem 0.6rem; font-size: 0.8rem; font-weight: 700; margin-left: 5px; }
    .controls { display: flex; align-items: center; gap: 0.8rem; }
    .control-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.5rem 0.9rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .control-btn:hover { border-color: var(--accent); color: var(--accent); }
    main { max-width: 1300px; margin: 2.5rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 2rem; }
    .product-card { background-color: var(--bg-card); border-radius: 14px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
    .product-img { width: 100%; height: 240px; object-fit: cover; background-color: #ffffff; }
    .product-info { padding: 1.4rem; display: flex; flex-direction: column; flex: 1; }
    .product-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.6rem; }
    .product-price { font-size: 1.3rem; font-weight: 800; color: var(--accent); margin-bottom: 1.2rem; }
    .btn-primary { background-color: var(--accent); color: #fff; padding: 0.8rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; }
    .btn-primary:hover { background-color: var(--accent-hover); }
    footer { background-color: var(--bg-secondary); border-top: 1px solid var(--border-color); text-align: center; padding: 2rem; margin-top: auto; color: var(--text-secondary); }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">🕶 OPTIKA.UZ</a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="home">Bosh sahifa</a></li>
        <li><a href="catalog.html" class="active" data-i18n="catalog">Katalog</a></li>
        <li><a href="detail.html" data-i18n="detail">Batafsil / Trendlar</a></li>
        <li><a href="cart.html" data-i18n="cart">Savat <span id="cart-badge-count" class="cart-badge">0</span></a></li>
        <li><a href="contact.html" data-i18n="contact">Aloqa & Buyurtma</a></li>
      </ul>
      <div class="controls">
        <button id="theme-btn" class="control-btn" onclick="toggleTheme()">🌙</button>
        <button class="control-btn" onclick="changeLanguage('uz')">UZ</button>
        <button class="control-btn" onclick="changeLanguage('ru')">RU</button>
        <button class="control-btn" onclick="changeLanguage('en')">EN</button>
      </div>
    </div>
  </header>

      { id: 19, name: { uz: "Klassik Braun", ru: "Классик Браун", en: "Classic Brown" }, price: "370,000 UZS", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5OatbipNpZpsWoL6xZIy-1FU_ISkbqwEp3whTKT9bcg&s=10" },
      { id: 20, name: { uz: "Yangi Eksklyuziv Trend 2026", ru: "Новая Эксклюзивная Тренд 2026", en: "New Exclusive Trend 2026" }, price: "550,000 UZS", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSp3NMsC0TDY7Mp9VO1dRI8m8J1Pp5WtXaJW92dLgTx_g&s=10" }
    ];

    const translations = {
      uz: { home: "Bosh sahifa", catalog: "Katalog", catalogTitle: "Barcha Ko'zoynaklar Katalogi", detail: "Batafsil / Trendlar", cart: "Savat", contact: "Aloqa & Buyurtma", addCart: "Savatga qo'shish" },
      ru: { home: "Главная", catalog: "Каталог", catalogTitle: "Каталог Всех Очков", detail: "Детали / Тренды", cart: "Корзина", contact: "Контакты & Заказ", addCart: "В корзину" },
      en: { home: "Home", catalog: "Catalog", catalogTitle: "All Glasses Catalog", detail: "Details / Trends", cart: "Cart", contact: "Contact & Order", addCart: "Add to Cart" }
    };

    let currentLang = localStorage.getItem('lang') || 'uz';
    let currentTheme = localStorage.getItem('theme') || 'dark';
    let cart = JSON.parse(localStorage.getItem('cart_items')) || [];

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('theme', currentTheme);
      document.getElementById('theme-btn').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
    }

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      updateTexts();
      renderProducts();
    }

    function updateTexts() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
      });
      document.getElementById('cart-badge-count').textContent = cart.length;
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      cart.push(p);
      localStorage.setItem('cart_items', JSON.stringify(cart));
      updateTexts();
      alert(p.name[currentLang] + " " + (currentLang==='uz'?"savatga qo'shildi!":currentLang==='ru'?"добавлен в корзину!":"added to cart!"));
    }

    function renderProducts() {
      const grid = document.getElementById('product-container');
      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" alt="${p.name[currentLang]}" class="product-img">
          <div class="product-info">
            <div class="product-title">${p.name[currentLang]}</div>
            <div class="product-price">${p.price}</div>
            <button class="btn-primary" onclick="addToCart(${p.id})">${translations[currentLang].addCart}</button>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.documentElement.setAttribute('data-theme', currentTheme);
      document.getElementById('theme-btn').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
      updateTexts();
      renderProducts();
    });
  </script>
</body>
</html>
