<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achki Do'koni | Savat</title>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #151c2c;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --border-color: #334155;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #d97706;
      --accent-hover: #b45309;
      --border-color: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; transition: background-color 0.3s, color 0.3s; }
    body { background-color: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow); }
    .nav-container { max-width: 1300px; margin: 0 auto; padding: 1.2rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 1.6rem; font-weight: 800; color: var(--accent); text-decoration: none; }
    .nav-links { display: flex; align-items: center; gap: 3rem; list-style: none; }
    .nav-links a { color: var(--text-primary); text-decoration: none; font-weight: 600; padding: 0.6rem 1.2rem; border-radius: 8px; }
    .nav-links a:hover, .nav-links a.active { background-color: var(--accent); color: #ffffff; }
    .cart-badge { background-color: #ef4444; color: white; border-radius: 9999px; padding: 0.2rem 0.6rem; font-size: 0.8rem; font-weight: 700; margin-left: 5px; }
    .controls { display: flex; align-items: center; gap: 0.8rem; }
    .control-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.5rem 0.9rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .control-btn:hover { border-color: var(--accent); color: var(--accent); }
    main { max-width: 900px; margin: 2.5rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }
    .cart-item { background-color: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); padding: 1.2rem; display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
    .cart-item img { width: 100px; height: 90px; object-fit: cover; border-radius: 8px; background: #fff; }
    .cart-item-details { flex: 1; }
    .cart-item-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.4rem; }
    .cart-item-price { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
    .btn-delete { background-color: #ef4444; color: #fff; border: none; padding: 0.6rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; }
    .btn-primary { background-color: var(--accent); color: #fff; padding: 1rem 2.5rem; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; text-decoration: none; display: inline-block; font-size: 1.1rem; }
    .btn-primary:hover { background-color: var(--accent-hover); }
    footer { background-color: var(--bg-secondary); border-top: 1px solid var(--border-color); text-align: center; padding: 2rem; margin-top: auto; color: var(--text-secondary); }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">🕶 OPTIKA.UZ</a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="home">Bosh sahifa</a></li>
        <li><a href="catalog.html" data-i18n="catalog">Katalog</a></li>
        <li><a href="detail.html" data-i18n="detail">Batafsil / Trendlar</a></li>
        <li><a href="cart.html" class="active" data-i18n="cart">Savat <span id="cart-badge-count" class="cart-badge">0</span></a></li>
        <li><a href="contact.html" data-i18n="contact">Aloqa & Buyurtma</a></li>
      </ul>
      <div class="controls">
        <button id="theme-btn" class="control-btn" onclick="toggleTheme()">🌙</button>
        <button class="control-btn" onclick="changeLanguage('uz')">UZ</button>
        <button class="control-btn" onclick="changeLanguage('ru')">RU</button>
        <button class="control-btn" onclick="changeLanguage('en')">EN</button>
      </div>
    </div>
  </header>

  <main>
    <h1 style="margin-bottom: 2rem; text-align: center;" data-i18n="cartTitle">Xarid Savati</h1>
    <div id="cart-container"></div>
    <div style="text-align: center; margin-top: 2.5rem;">
      <a href="contact.html" class="btn-primary" data-i18n="goCheckout">Telegram Orqali Rasmiylashtirish</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Optika.uz. Telegram Kanalimiz: <a href="https://t.me/achki_trend" style="color:var(--accent); text-decoration:none;" target="_blank">@achki_trend</a></p>
  </footer>

  <script>
    const translations = {
      uz: { home: "Bosh sahifa", catalog: "Katalog", detail: "Batafsil / Trendlar", cart: "Savat", contact: "Aloqa & Buyurtma", cartTitle: "Xarid Savati", cartEmpty: "Savatda hozircha mahsulotlar yo'q", goCheckout: "Telegram Orqali Rasmiylashtirish", remove: "O'chirish" },
      ru: { home: "Главная", catalog: "Каталог", detail: "Детали / Тренды", cart: "Корзина", contact: "Контакты & Заказ", cartTitle: "Корзина Покупок", cartEmpty: "В корзине пока нет товаров", goCheckout: "Оформить через Telegram", remove: "Удалить" },
      en: { home: "Home", catalog: "Catalog", detail: "Details / Trends", cart: "Cart", contact: "Contact & Order", cartTitle: "Shopping Cart", cartEmpty: "Your cart is currently empty", goCheckout: "Checkout via Telegram", remove: "Remove" }
    };

    let currentLang = localStorage.getItem('lang') || 'uz';
    let currentTheme = localStorage.getItem('theme') || 'dark';
    let cart = JSON.parse(localStorage.getItem('cart_items')) || [];

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('theme', currentTheme);
      document.getElementById('theme-btn').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
    }

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      updateTexts();
      renderCart();
    }

    function updateTexts() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
      });
      document.getElementById('cart-badge-count').textContent = cart.length;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart_items', JSON.stringify(cart));
      updateTexts();
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-container');
      if (cart.length === 0) {
        container.innerHTML = `<p style="text-align:center; font-size:1.3rem; padding:3rem; color:var(--text-secondary);">${translations[currentLang].cartEmpty}</p>`;
        return;
      }
      container.innerHTML = cart.map((item, index) => `
        <div class="cart-item">
          <img src="${item.img}" alt="${item.name[currentLang]}">
          <div class="cart-item-details">
            <div class="cart-item-title">${item.name[currentLang]}</div>
            <div class="cart-item-price">${item.price}</div>
          </div>
          <button class="btn-delete" onclick="removeFromCart(${index})">${translations[currentLang].remove}</button>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.documentElement.setAttribute('data-theme', currentTheme);
      document.getElementById('theme-btn').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
      updateTexts();
      renderCart();
    });
  </script>
</body>
</html>
